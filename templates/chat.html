<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Assistant</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="page-wrapper">

        <div class="chat-card">

            <!-- ================= HEADER ================= -->

            <div class="chat-header">

                <div class="doctor-section">

                    <div class="doctor-image-wrapper">

                        <!-- CHANGE doctor.png IF YOUR IMAGE HAS ANOTHER NAME -->
                        <img src="{{ url_for('static', filename='assets/doctor.png') }}"
     alt="Medical Assistant"
     class="assistant-avatar">

                        <span class="online-dot"></span>

                    </div>

                    <div class="doctor-info">
                        <h2>Medical Assistant</h2>
                        <p>
                            <span class="status-dot"></span>
                            AI Assistant • Online
                        </p>
                    </div>

                </div>

                <div class="header-buttons">

                    <button class="header-btn"
                            onclick="newChat()"
                            title="New Chat">
                        <i class="fa-solid fa-plus"></i>
                    </button>

                    <button class="header-btn delete-btn"
                            onclick="clearChat()"
                            title="Clear Chat">
                        <i class="fa-solid fa-trash"></i>
                    </button>

                </div>

            </div>


            <!-- ================= CHAT BODY ================= -->

            <div class="chat-body" id="chatBody">

                <!-- Welcome Message -->

                <div class="message-row bot-row">

                    <div class="avatar bot-avatar">
                        <i class="fa-solid fa-user-doctor"></i>
                    </div>

                    <div class="message-content">

                        <div class="message-name">
                            Medical Assistant
                        </div>

                        <div class="message bot-message">
                            Hello! 👋 I'm your medical assistant.
                            <br>
                            How can I help you today?
                        </div>

                        <div class="message-time">
                            Just now
                        </div>

                    </div>

                </div>

            </div>


            <!-- ================= SUGGESTIONS ================= -->

            <div class="suggestions-section">

                <button class="suggestion"
                        onclick="askQuestion('What are the symptoms of diabetes?')">

                    <i class="fa-solid fa-stethoscope"></i>
                    Diabetes symptoms

                </button>

                <button class="suggestion"
                        onclick="askQuestion('What is normal blood pressure?')">

                    <i class="fa-solid fa-heart-pulse"></i>
                    Blood pressure

                </button>

                <button class="suggestion"
                        onclick="askQuestion('What is a healthy diet?')">

                    <i class="fa-solid fa-apple-whole"></i>
                    Healthy diet

                </button>

            </div>


            <!-- ================= INPUT ================= -->

            <div class="input-section">

                <form id="messageForm">

                    <div class="input-wrapper">

                        <input type="text"
                               id="messageInput"
                               name="msg"
                               class="message-input"
                               placeholder="Ask your medical question..."
                               autocomplete="off">

                        <button type="submit"
                                class="send-button"
                                id="sendButton">

                            <i class="fa-solid fa-paper-plane"></i>

                        </button>

                    </div>

                </form>

                <div class="disclaimer">

                    <i class="fa-solid fa-shield-heart"></i>

                    AI-generated information. This chatbot is not a substitute
                    for professional medical advice.

                </div>

            </div>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const form = document.getElementById("messageForm");
        const input = document.getElementById("messageInput");
        const chatBody = document.getElementById("chatBody");
        const sendButton = document.getElementById("sendButton");


        // ================= SEND MESSAGE =================

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const message = input.value.trim();

            if (message === "") {
                return;
            }

            addUserMessage(message);

            input.value = "";

            showTyping();

            sendMessage(message);

        });


        // ================= SEND TO FLASK =================

        function sendMessage(message) {

            const formData = new FormData();

            formData.append("msg", message);

            fetch("/get", {
                method: "POST",
                body: formData
            })

            .then(response => response.text())

            .then(data => {

                removeTyping();

                addBotMessage(data);

            })

            .catch(error => {

                console.error(error);

                removeTyping();

                addBotMessage(
                    "Sorry, something went wrong. Please try again."
                );

            });

        }


        // ================= USER MESSAGE =================

        function addUserMessage(message) {

            const row = document.createElement("div");

            row.className = "message-row user-row";

            row.innerHTML = `

                <div class="message-content user-content">

                    <div class="message-name user-name">
                        You
                    </div>

                    <div class="message user-message">
                        ${escapeHtml(message)}
                    </div>

                    <div class="message-time user-time">
                        Just now
                    </div>

                </div>

                <div class="avatar user-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>

            `;

            chatBody.appendChild(row);

            scrollToBottom();

        }


        // ================= BOT MESSAGE =================

        function addBotMessage(message) {

            const row = document.createElement("div");

            row.className = "message-row bot-row";

            row.innerHTML = `

                <div class="avatar bot-avatar">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>

                <div class="message-content">

                    <div class="message-name">
                        Medical Assistant
                    </div>

                    <div class="message bot-message">
                        ${escapeHtml(message)}
                    </div>

                    <div class="message-time">
                        Just now
                    </div>

                </div>

            `;

            chatBody.appendChild(row);

            scrollToBottom();

        }


        // ================= TYPING =================

        function showTyping() {

            const typing = document.createElement("div");

            typing.className = "message-row bot-row";
            typing.id = "typingIndicator";

            typing.innerHTML = `

                <div class="avatar bot-avatar">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>

                <div class="message-content">

                    <div class="message-name">
                        Medical Assistant
                    </div>

                    <div class="typing-message">

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>

                </div>

            `;

            chatBody.appendChild(typing);

            scrollToBottom();

        }


        function removeTyping() {

            const typing = document.getElementById("typingIndicator");

            if (typing) {
                typing.remove();
            }

        }


        // ================= SUGGESTION =================

        function askQuestion(question) {

            input.value = question;

            input.focus();

        }


        // ================= NEW CHAT =================

        function newChat() {

            chatBody.innerHTML = `

                <div class="message-row bot-row">

                    <div class="avatar bot-avatar">
                        <i class="fa-solid fa-user-doctor"></i>
                    </div>

                    <div class="message-content">

                        <div class="message-name">
                            Medical Assistant
                        </div>

                        <div class="message bot-message">
                            Hello! 👋 I'm your medical assistant.
                            <br>
                            How can I help you today?
                        </div>

                        <div class="message-time">
                            Just now
                        </div>

                    </div>

                </div>

            `;

            input.value = "";

            input.focus();

        }


        // ================= CLEAR CHAT =================

        function clearChat() {

            chatBody.innerHTML = `

                <div class="empty-chat">

                    <div class="empty-icon">
                        <i class="fa-solid fa-comment-medical"></i>
                    </div>

                    <h3>Chat cleared</h3>

                    <p>
                        Ask me a medical question to start a new conversation.
                    </p>

                </div>

            `;

        }


        // ================= SCROLL =================

        function scrollToBottom() {

            chatBody.scrollTop = chatBody.scrollHeight;

        }


        // ================= ESCAPE HTML =================

        function escapeHtml(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }


        // Enter key

        input.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                form.dispatchEvent(new Event("submit"));

            }

        });

    </script>

</body>

</html>
